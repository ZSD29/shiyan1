<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZSD29 的個人主頁</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background: #0d1117;
      color: #c9d1d9;
    }
    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 32px 48px;
      text-align: center;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }
    h1 { color: #58a6ff; margin-bottom: 8px; }
    p { color: #8b949e; line-height: 1.6; }
    .tag {
      display: inline-block;
      padding: 4px 12px;
      background: #238636;
      color: #ffffff;
      border-radius: 20px;
      font-size: 14px;
      margin-top: 12px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>你好，我是 ZSD29 👋</h1>
    <p>這是我的第一個託管在 GitHub Pages 上的個人網站。</p>
    <div class="tag">GitHub 新手啟航</div>
  </div>
</body>
</html>
