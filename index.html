<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZSD29 的個人主頁</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background: #0d1117;
      color: #c9d1d9;
    }
    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 16px;
      padding: 40px;
      max-width: 420px;
      text-align: center;
      box-shadow: 0 12px 32px rgba(0,0,0,0.5);
    }
    .avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      border: 2px solid #58a6ff;
      margin-bottom: 16px;
    }
    h1 { color: #f0f6fc; margin: 0 0 8px 0; font-size: 24px; }
    p { color: #8b949e; line-height: 1.6; font-size: 14px; margin-bottom: 24px; }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .link-btn {
      display: block;
      padding: 10px 16px;
      background: #21262d;
      color: #58a6ff;
      text-decoration: none;
      border: 1px solid #30363d;
      border-radius: 8px;
      font-weight: 500;
      transition: all 0.2s ease;
    }
    .link-btn:hover {
      background: #30363d;
      border-color: #8b949e;
      color: #ffffff;
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="https://github.com/ZSD29.png" alt="Avatar" class="avatar">
    <h1>ZSD29</h1>
    <p>正在探索開源世界與前端建置，這是基於 GitHub Pages 架設的個人聚合頁。</p>
    <div class="btn-group">
      <a href="https://github.com/ZSD29" target="_blank" class="link-btn">造訪我的 GitHub 主頁</a>
      <a href="https://github.com/ZSD29/shiyan1" target="_blank" class="link-btn">檢視此網站原始碼</a>
    </div>
    <p style="font-size: 12px; margin-top: 20px; color: #484f58;">© 2026 ZSD29 · Built with GitHub Pages</p>
  </div>
</body>
</html>
